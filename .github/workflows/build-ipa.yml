name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Fit3Bridge IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate
        working-directory: ./fit3bridge

      - name: Build Project (Release)
        run: |
          xcodebuild \
            -project Fit3Bridge.xcodeproj \
            -scheme Fit3Bridge \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean build
        working-directory: ./fit3bridge

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Fit3Bridge.app Payload/
          zip -r Fit3Bridge.ipa Payload
        working-directory: ./fit3bridge

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fit3Bridge-IPA
          path: ./fit3bridge/Fit3Bridge.ipa
          retention-days: 30

      - name: Show Build Info
        run: |
          ls -la ./fit3bridge/Fit3Bridge.ipa
          echo "IPA size: $(du -h ./fit3bridge/Fit3Bridge.ipa | cut -f1)"